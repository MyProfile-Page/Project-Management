 const input = document.getElementById("reps");

 const params = new URLSearchParams(window.location.search);
let paramId = "none";
let paramnm = "none";

paramnm = params.get("param2");
document.getElementById("comp-name").textContent = paramnm;

input.addEventListener("input", function () {
     const selectedValue = input.value;      
      
    if (selectedValue === "Customer Codes") {        
        
        window.location.href = `./cust-tables-add-del.html?param1=${paramId}&param2=${paramnm}`;
    }
    if (selectedValue === "Items Categories Codes") {        
        
        window.location.href = `./ctg-tables-add-del.html?param1=${paramId}&param2=${paramnm}`;
    }
    if (selectedValue === "Manufacturers/Suppliers Codes") {        
        
        window.location.href = `./mnsp-tables-add-del.html?param1=${paramId}&param2=${paramnm}`;
    }
    if (selectedValue === "Movement Type Codes") {        
        
        window.location.href = `./mvtp-tables-add-del.html?param1=${paramId}&param2=${paramnm}`;
    }
    if (selectedValue === "Items Unit Codes") {        
        
        window.location.href = `./uis-tables-add-del.html?param1=${paramId}&param2=${paramnm}`;
    }

    }

        window.location.href = `./owners-tables-add-del.html?param1=${paramId}&param2=${paramnm}`;
    }
});
