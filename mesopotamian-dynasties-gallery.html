.gallery-container {
  display: grid;
  /* Automatically creates as many 250px columns as will fit the screen */
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 16px; /* Spacing between the grid items */
  padding: 16px;
}

/* Individual item styling */
.gallery-item {
  margin: 0;
  background-color: #f4f4f4;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

/* Make sure images scale correctly without stretching */
.gallery-item img {
  width: 100%;
  height: 200px;

  display: block;
}

// Function to update the image on screen
function updateImage() {
  carouselImage.src = images[currentIndex].src;
    carouselCaption.textContent = images[currentIndex].caption;
  
//  carouselImage.style.width = "200px";

}

// Next Button Click
nextBtn.addEventListener("click", () => {
  currentIndex++;
  if (currentIndex >= images.length) {
    currentIndex = 0; // Loop back to the first image
  }
  updateImage();
});

// Previous Button Click
prevBtn.addEventListener("click", () => {
  currentIndex--;
  if (currentIndex < 0) {
    currentIndex = images.length - 1; // Loop to the last image
  }
  updateImage();
});
