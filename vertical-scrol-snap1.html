<!DOCTYPE html>
<html>
<head>

  <title>Firestore Table (IIS + Localhost)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

 <style>
.vertical-scroll-container {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  height: 100vh;                 /* Full screen height */
  width: 50%;                   /* 100% mobile screen width */
 /* scrollbar-width: none;  */         /* Hides scrollbar on Firefox */
 margin: 0 auto;
  padding: 0;
}
@media (max-width: 768px) {
.vertical-scroll-container {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  height: 100vh;                 /* Full screen height */
  width: 100%;                   /* 100% mobile screen width */
 /* scrollbar-width: none;  */         /* Hides scrollbar on Firefox */
 margin: 0 auto;
  padding: 0;
}
}

/* .vertical-scroll-container::-webkit-scrollbar { */
/*  display: none;       */          /* Hides scrollbar on Chrome/Safari */
/* }  */
/* Style for the overlay caption (TikTok style) */
.image-caption {
/*  position: absolute;  */
  bottom: 40px;      /* Places it near the bottom of the screen */
  left: 20px;
  right: 20px;
  color: white;
  background-color: black; /* Semi-transparent black background */
  padding: 12px;
  border-radius: 8px;
  font-family: sans-serif;
  font-size: 16px;
  width: 60%;
}

</style>
</head>

<body ">
 
 <div class="vertical-scroll-container">
  <div >
  <figure  >
  <figcaption class="image-caption"><strong>1999 CE</strong><br>Line2<br>Line3</figcaption>
  <img style="width: 100%; height: 100%; text-align: center; display: inline-block; margin: auto; " src="CA-IMG-1999.JPG" alt="Item 2">
 
  </figure>
  </div>
  <div >
  <figure  >
  <figcaption class="image-caption">1982 CE</figcaption>
  <img style="width: 100%; height: 100%; object-fit: cover" src="CA-IMG-1982.JPG" alt="Item 2">
  
  </figure>
  </div>
  <div >
  <figure  >
  <figcaption class="image-caption">1939-1945 CE</figcaption>
  <img style="width: 100%; height: 100%; object-fit: cover" src="CA-IMG-1939-1945.JPG" alt="Item 3">
   
   </figure>
  </div>
</div>
</body>
</html>
