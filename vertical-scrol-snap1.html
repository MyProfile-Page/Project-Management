<!DOCTYPE html>
<html>
<head>

  <title>Firestore Table (IIS + Localhost)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

 <style>
.vertical-scroll-container {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  height: 100vh;                 /* Full screen height */
  width: 50%;                   /* 100% mobile screen width */
 /* scrollbar-width: none;  */         /* Hides scrollbar on Firefox */
 margin: 0 auto;
  padding: 0;
}
@media (max-width: 768px) {
.vertical-scroll-container {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  height: 100vh;                 /* Full screen height */
  width: 100%;                   /* 100% mobile screen width */
 /* scrollbar-width: none;  */         /* Hides scrollbar on Firefox */
 margin: 0 auto;
  padding: 0;
}
}

/* .vertical-scroll-container::-webkit-scrollbar { */
/*  display: none;       */          /* Hides scrollbar on Chrome/Safari */
/* }  */


</style>
</head>

<body ">
 
 <div class="vertical-scroll-container">
  <div >
  <figure >
  <img style="width: 100%; height: 100%; object-fit: cover" src="CA-IMG-1999.JPG" alt="Item 2">
  <figcaption style="background-color: grey; color: white; font-style: italic; padding: 12px; text-align: center;">1999 CE</figcaption>
  </figure>
  </div>
  <div >
  <figure>
  <img style="width: 100%; height: 100%; object-fit: cover" src="CA-IMG-1982.JPG" alt="Item 2">
  <figcaption style="background-color: grey; color: white; font-style: italic; padding: 12px; text-align: center;">1982 CE</figcaption>
  </figure>
  </div>
  <div >
  <figure>
  <img style="width: 100%; height: 100%; object-fit: cover" src="CA-IMG-1939-1945.JPG" alt="Item 3">
   <figcaption style="background-color: grey; color: white; font-style: italic; padding: 12px; text-align: center;">1939-1945 CE</figcaption>
   </figure>
  </div>
</div>
</body>
</html>
