  getFirestore, 
  collection, 
  query,
  orderBy,
  addDoc, 
  setDoc,
  getDocs, 
  getDoc,
  deleteDoc, 
  doc,

// Your web app's Firebase configuration
const firebaseConfig = {

   // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app); 
  const params = new URLSearchParams(window.location.search);
let paramId = "none";
let paramnm = "none";
paramId = params.get("param1");

  // 🔹 READ (Load Data into Table)
async function loadnewitemstable() {

  const table = document.getElementById("projTable");
  
  table.innerHTML = "";
  const collectionRef = collection(db, "projcodes");
  const q = query(collectionRef, orderBy("projnbr", "asc"));
  
  const querySnapshot = await getDocs(q);

  let grandTotalCents = 0; // ✅ accumulator for grand total

  querySnapshot.forEach((document) => {
    const data = document.data();
    const docId = document.id;

   
    table.innerHTML += `
      
      <tr class="tr-main-row"  >
       
        
        <td style="border-top: 0.05vw solid black; border-right: 0.05vw solid black; font-size: clamp(0.9rem, 1.3vw, 1.4rem); font-weight: 400; padding-left: 0.5vw;">${data.projnbr}</td>
<td style="border-top: 0.05vw solid black; border-right: 0.05vw solid black; font-size: clamp(0.9rem, 1.3vw, 1.4rem); font-weight: 400; padding-left: 0.5vw;">${data.projname}</td>
                <td style="border: 0.05vw solid black; text-align: center;">

           <button onclick="deleteproj('${docId}')" class="edit-delt-btn">Delete</button>
        </td>  
          
        </td>          
        
      </tr>
<tr>
</tr>

    
    `;
  });

     }   // ✅ ONLY ONE closing bracket for function





 // Clear input fields
  window.clearInputs = async function () {
  
    
    document.getElementById("projnbr").value = "";
    document.getElementById("projname").value = "";
   

  }




 






 // 🔹 DELETE (Remove Record)
  window.deleteproj = async function (id) {
    await deleteDoc(doc(db, "projcodes", id));
    alert("Task deleted");
    clearInputs();
    loadnewitemstable();
  };

// 🔹 CREATE (Insert Data)
window.addproj = async function () {
  const projnbr = document.getElementById("projnbr").value;
  const projname = document.getElementById("projname").value;   
  try {

    // 🔹 Use nbr as document ID
     const docRef = doc(db, "projcodes", projnbr.toString());
    

    // 🔹 Check if document already exists
 //   const existingDoc = await getDoc(docRef);

   

    // 🔹 Create document with nbr as ID
    await setDoc(docRef, {
      projnbr: parseInt(projnbr, 10),
      projname: projname,     
      createdAt: serverTimestamp()
      // createdAt: new Date()
    });

    alert("New Task added");
    
    loadnewitemstable(); // refresh table

  } catch (error) {
    console.error("Error adding proj Code:", error);
    alert("Error adding. Check console.");
  }
};

  
  loadnewitemstable();
