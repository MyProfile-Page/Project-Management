<!DOCTYPE html>
<html>
<head>

  <title>Firestore Table (IIS + Localhost)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

 <style>
 .boundry-div {
 margin: 0 auto;
 width: 70%;
 }
 @media (max-width: 768px) {
 .boundry-div {
 margin: 0 auto;
 width: 100%;
 }
 }
/* Base scroll snap setup from earlier */
.vertical-scroll-container {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  height: 250vh;
  width: 100%;
  margin: 0;
  padding: 0;
}

.scroll-page {
  position: relative; /* Allows us to absolute-position the caption over the image */
  flex: 0 0 100vh;
  width: 100%;
  height: 250vh;
  scroll-snap-align: start;
  margin: 0; /* Important: removes default browser figure margins */
}

.scroll-page img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.responsive-img {
  width: 100%;
  height: auto;
  object-fit: cover;
 }

/* Style for the overlay caption (TikTok style) */
.image-caption {
  position: absolute;
  bottom: 40px;      /* Places it near the bottom of the screen */
  left: 20px;
  right: 20px;
  color: white;
  background-color: rgba(0, 0, 0, 0.6); /* Semi-transparent black background */
  padding: 12px;
  border-radius: 8px;
  font-family: sans-serif;
  font-size: 16px;
}
</style>
</head>

<body ">
 <div class="boundry-div">
 <div class="vertical-scroll-container">
  <!-- Card 1 -->
  <figure class="scroll-page responsive-img">
    <img src="CA-IMG-1982.JPG" alt="A beautiful mountain landscape">
    <figcaption class="image-caption">
    <h3>1982 CE</h3>
    <p>Constitution Act</p>
    <small>Queen Elizabeth II signs the Constitution Act</small><br>
	<small>Patriating Canada constitution and establishing</small><br>
	<small>The Charter of Rights and Freedom</small>
  </figcaption>
	
  </figure>

  <!-- Card 2 -->
  <figure class="scroll-page">
    <img src="CA-IMG-1939-1945.JPG" alt="A busy city street at night">
    <figcaption class="image-caption">Downtown Tokyo Lights</figcaption>
  </figure>
  
  <!-- Card 3 -->
  <figure class="scroll-page">
    <img src="CA-IMG-1999.JPG" alt="A busy city street at night">
    <figcaption class="image-caption">Downtown Tokyo Lights</figcaption>
  </figure>
</div>
</div
</body>
</html>
