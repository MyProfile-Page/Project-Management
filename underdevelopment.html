  // Select the container and all image wrappers
  const container = document.querySelector('.scroll-container');
  const wrappers = document.querySelectorAll('.image-wrapper');
  
  let isScrolling = false; // Cooldown flag to prevent scrolling multi-steps at once

  window.addEventListener('keydown', (event) => {
    // Only intercept Up and Down arrow keys
    if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
    
    // Prevent default browser behavior (like sudden erratic page jumping)
    event.preventDefault();

    // If a scroll animation is already in progress, ignore the keystroke
    if (isScrolling) return;

    // Determine the current scroll position
    const currentScroll = container.scrollTop;
    const viewHeight = window.innerHeight;
    
    // Calculate which index the user is currently looking at
    // Using Math.round handles any minor sub-pixel rendering discrepancies
    let currentIndex = Math.round(currentScroll / viewHeight);
    let targetIndex = currentIndex;

    if (event.key === 'ArrowDown') {
      // Move to the next image if we aren't at the end
      if (currentIndex < wrappers.length - 1) {
        targetIndex = currentIndex + 1;
      }
    } else if (event.key === 'ArrowUp') {
      // Move to the previous image if we aren't at the beginning
      if (currentIndex > 0) {
        targetIndex = currentIndex - 1;
      }
    }

    // If the target has changed, execute the smooth snap
    if (targetIndex !== currentIndex) {
      isScrolling = true;
      
      container.scrollTo({
        top: targetIndex * viewHeight,
        behavior: 'smooth'
      });

      // Match this timeout roughly to your CSS smooth scroll duration (e.g., 500ms)
      // This prevents the "held down key" from breaking the layout alignment
      setTimeout(() => {
        isScrolling = false;
      }, 500);
    }
  });
</script>
