async function saveProject(paramId, projname) {

    const counterRef = doc(db, "projcodes", paramId);

    nextProjNbr = await runTransaction(db, async (transaction) => {

        const counterDoc = await transaction.get(counterRef);

        let nextNumber = 1;

        if (counterDoc.exists()) {
            nextNumber = counterDoc.data().lastProjNbr + 1;
        }

        transaction.set(
            counterRef,
            { lastProjNbr: nextNumber },
            { merge: true }
        );

        return nextNumber;
    });

   }
