     1. Basic    https://docs.flutterflow.io/quickstart/   

        how to collect your created rows and columns into container of Flutter

Method 1: The "Wrap Widget" Shortcut (Fastest)FlutterFlow has a built-in shortcut that wraps your layout instantly without breaking your current design.Right-click on your existing Row or Column (either on the visual canvas or in the Widget Tree).Click on Wrap Widget from the context menu.Select Container from the popup list of widgets.FlutterFlow will automatically generate a new Container and place your Row or Column neatly inside it.

Method 2: Using the Widget Tree (Drag & Drop)If you already have an empty Container on your screen, you can move your filled layout into it structurally.Locate your filled Row or Column in the Widget Tree panel on the left side of the screen.Click and hold the Row or Column.Drag it directly onto the Container widget in the Widget Tree.Release the mouse to drop it inside.

NOTE: If your filled Container is placed inside a Stack widget, you can click and drag it completely freely to any exact pixel coordinate on the canvas

NOTE: You can have multiple containers inside a single canvas screen in FlutterFlow. There is no limit to how many containers you can add to a page.To manage multiple containers successfully, you just need to arrange them using a layout widget.How to Arrange Multiple ContainersBecause a standard screen canvas needs structure, you cannot just drop multiple containers randomly unless you organize them in one of three ways:

Vertically: Place them inside a Column to stack your containers from top to bottom (like a news feed or product list).

Horizontally: Place them inside a Row to line your containers up side-by-side (like a horizontal scrolling menu).

Free-Floating / Overlapping: Place them inside a Stack if you want to drag your containers anywhere on the screen or overlap them on top of one another.

NOTE: 

Column: Arranges widgets vertically (top to bottom). Elements cannot overlap.Row: Arranges widgets horizontally (left to right). Elements cannot overlap.Stack: Arranges widgets on top of each other (back to front). The first widget you put in the Stack is at the bottom/back, and subsequent widgets sit on top of it.

 Step 3: Link the Project ID to FlutterFlowNow you will tell FlutterFlow exactly which cloud database it should talk to.While still in your Firebase Project Settings tab, look for the Project ID row and copy that unique string of text.Open your project dashboard inside FlutterFlow.On the left sidebar navigation menu, click Settings & Integrations (the gear icon).Under the Project Setup section, select Firebase.Paste your copied ID string directly into the Firebase Project ID entry field.Click the Connect button right next to the field.
