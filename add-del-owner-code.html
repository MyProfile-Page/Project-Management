 const labelcomp = document.getElementById('comp-name');

//  comp-name.text = "GrowLite";

let paramId = "";

  // 🔹 READ (Load Data into Table)
async function loadownerstable() {

  const table = document.getElementById("ownerstable");
  
  table.innerHTML = "";
  const collectionRef = collection(db, "ownerstable");
  const q = query(collectionRef, orderBy("ownerId", "asc"));
  
  const querySnapshot = await getDocs(q);

  let grandTotalCents = 0; // ✅ accumulator for grand total

  querySnapshot.forEach((document) => {
    const data = document.data();
    const docId = document.id;

   
    table.innerHTML += `

<td style="border-top: 0.05vw solid black; border-right: 0.05vw solid black; font-size: clamp(0.9rem, 1.3vw, 1.4rem); font-weight: 450; padding-left: 0.5vw;">${data.inbr}</td>

<tr>

    alert("Owner deleted");

  };

// 🔹 CREATE (Insert Data)
window.additem = async function () {

  const ownernm = document.getElementById("ownernm").value;
  const ownerdatatype = document.getElementById("ownerdatatype").value;
  const ownerId = document.getElementById("ownerId").value;
  const owneret = document.getElementById("owneret").value;
  const ownertt = document.getElementById("ownertt").value;
  const ownertsdt = document.getElementById("ownertsdt").value;
  const ownertedt = document.getElementById("ownertedt").value;
  const ownertstt = document.getElementById("ownertstt").value;
  

if (ownernm === "" || ownerId === "" ){
    alert("Please Enter all Manadatory datas of the Database sub owner");
    return;
  }
     
  try {

    // 🔹 Use nbr as document ID
     const docRef = doc(db, "ownerstable", ownerId);    

      // 🔹 Check if document already exists
    const existingDoc = await getDoc(docRef);

    if (existingDoc.exists()) {
      alert("Sub Owner already exists!");
      return;
    }

   

    // 🔹 Create document with nbr as ID
