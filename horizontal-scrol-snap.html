<!DOCTYPE html>
<html>
<head>

  <title>Firestore Table (IIS + Localhost)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

 <style>
.scroll-container {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  gap: 15px;
  padding: 10px;
}
.scroll-card {
  flex: 0 0 80%; /* Shows 80% of the card, hinting that more content exists */
  scroll-snap-align: start;
}
.scroll-card img {
  width: 100%;
  border-radius: 8px;
}
.img1class
width:100px; height:80px;
}
</style>

</head>

<body ">
 
 <div class="scroll-container">
  <div class="scroll-card"><img src="CA-IMG-PALEO-INTUIT-WT.JPG" class="img1class" alt="Item 1"></div>
  <div class="scroll-card"><img src="CA-IMG-THULE-INTUIT-WT.JPG" alt="Item 2"></div>
  <div class="scroll-card"><img src="CA-IMG-NORSE-WT.JPG" alt="Item 3"></div>
</div>
</body>
</html>
