<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Snap Gallery</title>
  <style>
   /* 1. Update the group wrapper to accept fixed content height */
.image-group {
    /* REMOVE flex: 1; from here */
    flex-shrink: 0;         /* Stops the container from being squeezed down */
    display: flex;
    flex-direction: column; 
    background-color: #25252f;
    border-radius: 8px;
    padding: 10px;
    box-sizing: border-box;
}

/* 2. Set the explicit width and height directly on the image */
.image-group img {
    /* REMOVE flex: 1; from here */
    width: 100%;            /* Keeps it filling the sidebar horizontally */
    height: 180px;          /* 💡 SET YOUR COMFORTABLE IMAGE HEIGHT HERE (e.g., 180px, 200px) */
    object-fit: cover;      /* Crops the image beautifully without distortion */
    border-radius: 4px;
}




/* Reset margins and disable elastic bouncing */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden; /* Prevents double scrolling bars */
  background-color: #121212; /* Dark background to make images pop */
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* 1. Main Scroll Container */
.scroll-container {
  width: 100%;
  height: 100vh;                 /* Fills the exact height of the screen */
  overflow-y: scroll;            /* Allows vertical scrolling */
  scroll-snap-type: y mandatory;  /* Forces the container to snap to items */
  scroll-behavior: smooth;
  
  /* Hide standard scrollbars for an app-like look */
  -ms-overflow-style: none;  /* IE and Edge */
  scrollbar-width: none;     /* Firefox */
}

/* Hide webkit scrollbar for Chrome, Safari, and Opera */
.scroll-container::-webkit-scrollbar {
  display: none;
}

/* 2. Individual Image Wrapper */
.image-wrapper {
  width: 100%;
  height: 100vh;                 /* Ensures each wrapper takes exactly one full screen */
  scroll-snap-align: center;      /* Snaps the center of this element to the center of the screen */
  scroll-snap-stop: always;       /* Forces users to stop at each image instead of skipping past */
  
  /* Flexbox configurations to center content inside the wrapper */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  position: relative;
}

/* 3. The Image Component */
.image-wrapper img {
  max-width: 100%;
  max-height: 80vh;              /* Leaves room for padding and captions */
  object-fit: contain;           /* Keeps the photo aspect ratio intact without cropping */
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

/* Caption overlay text */
.caption {
  color: #ffffff;
  margin-top: 15px;
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.5px;
  opacity: 0.8;
}

/* ==========================================
   DESKTOP OPTIMIZATIONS (Screens wider than 768px)
   ========================================== */
@media (min-width: 769px) {
  /* Restrict the width on ultra-wide desktop monitors so vertical photos don't stretch */
  .scroll-container {
    max-width: 600px; /* Limits the viewable column to a realistic mobile-app ratio on desktop */
    margin: 0 auto;   /* Perfectly centers the app container on your monitor */
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    background-color: #1a1a1a; /* Slight contrast difference for the desktop background framing */
  }

  .image-wrapper img {
    max-height: 75vh; /* Slightly smaller maximum height to account for different desktop viewing angles */
    transition: transform 0.3s ease;
  }
  
  /* Adds a smooth hover animation on desktop screens */
  .image-wrapper img:hover {
    transform: scale(1.02);
  }
}

  </style>
</head>
<body>

  <!-- The main scrolling timeline -->
  <div class="scroll-container">
    
    <!-- Image Wrapper 1 -->
    <div class="image-wrapper">
      <img src="Troy_2727-new.jpg" alt="Description">
      <div class="caption">Image 1: Mountain Serenity</div>
    </div>

    <!-- Image Wrapper 2 -->
    <div class="image-wrapper">
      <img src="Paolo_Monti_-_Serie_fotografica_(Selçuk,_1962)_-_BEIC_6336866-new.jpg" alt="Description">
      <div class="caption">Image 2: Ocean View</div>
    </div>

    <!-- Image Wrapper 3 -->
    <div class="image-wrapper">
      <img src="Eastbound_over_SCB.jpg" alt="Description">
      <div class="caption">Image 3: Mist in the Woods</div>
    </div>

  </div>

</body>
</html>
