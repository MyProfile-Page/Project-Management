<!DOCTYPE html>
<html>
<head>

  <title>Firestore Table (IIS + Localhost)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

 <style>
.vertical-scroll-container {
  display: flex;
  flex-direction: column;        /* Stacks items vertically */
  overflow-y: auto;              /* Enables vertical scrolling */
  scroll-snap-type: y mandatory; /* Forces snapping on the Y-axis */
  height: 100vh;                 /* Sets container to full mobile screen height */
  scrollbar-width: none;         /* Hides scrollbar on Firefox */
}

/* Hides scrollbar on Chrome, Safari, and Opera */
.vertical-scroll-container::-webkit-scrollbar {
  display: none;
}

.scroll-page {
  flex: 0 0 100vh;               /* Makes each image section exactly full screen */
  scroll-snap-align: start;      /* Snaps to the top of each item */
  height: 100vh;
}

.scroll-page img {
  width: 100%;
  height: 100%;
  object-fit: cover;             /* Ensures images fill the screen nicely without distorting */
}
</style>
</head>

<body ">
 
 <div class="vertical-scroll-container">
  <div class="scroll-card"><img src="CA-IMG-PALEO-INTUIT-WT.JPG" alt="Item 1"></div>
  <div class="scroll-card"><img src="CA-IMG-THULE-INTUIT-WT.JPG" alt="Item 2"></div>
  <div class="scroll-card"><img src="CA-IMG-NORSE-WT.JPG" alt="Item 3"></div>
</div>
</body>
</html>
