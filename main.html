async function loadcodestables() {
     
try {
    const projlist = document.getElementById("projs");
    const app = initializeApp(firebaseConfig);
    const db = getFirestore();
    const collectionRefP = collection(db, "projcodes");
    const q = query(collectionRefP, where("ownerId", "==", paramId));
    const snapshot = await getDocs(q);
 //   const snapshot = await getDocs(collection(db, "projcodes")); 

    snapshot.forEach((doc) => {
      const data = doc.data();

      const option = document.createElement("option");
      option.value = data.projnbr; // This is what gets inserted into the input
      option.textContent = `${data.projnbr} - ${data.projname}`;

      
      projlist.appendChild(option);
    });

  }

    catch (error) {
    console.error("Error loading Project Codes:", error);
  }


}

function isValidSelection(inputId, datalistId) {
  const input = document.getElementById(inputId).value;
  const options = document.querySelectorAll(`#${datalistId} option`);

  const validValues = Array.from(options).map(opt => opt.value);

  return validValues.includes(input);
}

function clean(value) {
  return (value === null || 
          value === "null" || 
          value === "NaN" ||
          value === "undefined" || 
          value === "NaN" ||
          (typeof value === "number" && isNaN(value)))
         ? "" 
         : value;
}
